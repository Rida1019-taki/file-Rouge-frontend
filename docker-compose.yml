services:
  frontend:
    build:
      context: .
      args:
        VITE_API_URL: /api
    container_name: tomobilty-frontend
    ports:
      - "3000:80"
    environment:
      API_PROXY_PASS: http://host.docker.internal:8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped